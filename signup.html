<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NNAMP - Sign Up</title>
    <style>
        /* CUSTOM POPUP CSS - ADDED */
        .custom-alert {position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 99999; animation: popIn 0.3s ease;}
        .custom-alert-box {background: white; padding: 25px 20px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); white-space: pre-line; border-top: 4px solid #00c851;}
        .custom-alert-box.success { border-top: 4px solid #28a745; }
        .custom-alert-box.error { border-top: 4px solid #dc3545; }
        .custom-alert-box h3 { margin: 0 0 10px 0; color: #00c851; font-size: 18px; }
        .custom-alert-box p { margin: 0 0 15px 0; color: #333; font-size: 14px; }
        .custom-alert-btn {background: #00c851; color: white; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width:100%;}
        @keyframes popIn { from {transform: scale(0.8); opacity:0;} to {transform: scale(1); opacity:1;} }
        input,
textarea,
select {
    font-size: 16px;
}
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">NNAMP<span>🇳🇬</span></div>
        <h2>Create Account</h2>
        <p style="color: #00c851; font-weight:bold; margin-bottom:15px;">🎁 Get ₦1000 Welcome Bonus!🎁</p>

        <form id="signupForm">
            <input type="text" class="input" id="fullname" placeholder="Full Name" required>
            <input type="tel" class="input" id="phone" placeholder="Phone Number e.g 08012345678" required>
            <small id="phoneError" style="color:red; display:none;">Enter a valid Nigerian number e.g 08012345678</small>

            <div class="input-group">
                <input type="password" class="input" id="password" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
            </div>

            <div class="input-group">
                <input type="password" class="input" id="confirm-password" placeholder="Confirm Password" required>
                <span class="toggle-password" onclick="togglePassword('confirm-password')">👁️</span>
            </div>

            <input 
    type="tel" 
    class="input" 
    id="referralCode" 
    placeholder="Referral Code (Optional)"
>

            <button type="submit" class="btn" style="width:100%; margin-top:10px;">Sign Up</button>
        </form>

        <p style="margin-top:20px; color:var(--text-secondary);">
            Already have an account? <a href="login.html" style="color:var(--primary-color); font-weight:bold;">Login</a>
        </p>
    </div>

<script type="module">
  import { auth, db } from "./firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    doc,
    setDoc,
    addDoc,
    collection,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
console.log("Firebase module loaded");
// GLOBAL CUSTOM ALERT - UPDATED
function showAlert(title, message, type = "info", onClose = null) {

    let alertDiv = document.createElement("div");

    alertDiv.className = "custom-alert";

    alertDiv.innerHTML = `
        <div class="custom-alert-box ${type}">
            <h3>${title}</h3>
            <p>${message}</p>
            <button class="custom-alert-btn">OK</button>
        </div>
    `;

    document.body.appendChild(alertDiv);

    function closeAlert() {

        if (document.body.contains(alertDiv)) {
            alertDiv.remove();
        }

        if (onClose) {
            onClose();
        }
    }

    alertDiv.querySelector(".custom-alert-btn")
        .onclick = closeAlert;

    setTimeout(closeAlert, 20000);
}

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    let ref = urlParams.get('ref');

    if (!ref) {
        ref = localStorage.getItem('referralCode');
    }

    if (ref) {
        document.getElementById('referralCode').value = ref;
    }
}

function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password"? "text" : "password";
}
window.togglePassword = togglePassword;

function isValidNigerianNumber(phone) {
    phone = phone.replace(/\s/g, '');
    const regex = /^(070|080|081|090|091)[0-9]{8}$/;
    return regex.test(phone);
}



document.getElementById('signupForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const fullname = document.getElementById('fullname').value;
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const referredBy = document.getElementById('referralCode').value;
    const phoneError = document.getElementById('phoneError');

    phoneError.style.display = 'none';

if(!isValidNigerianNumber(phone)){
    phoneError.style.display = 'block';
    showAlert("Invalid Number ❌", "Please enter a valid Nigerian phone number.\nExample: 08012345678", "error");
    return;
}

if(password !== confirmPassword){
    showAlert("Error ❌", "Passwords do not match!", "error");
    return;
}

// Convert phone number into a hidden Firebase email
const email = phone + "@nnamp.app";

try {

    // Create Firebase Authentication account
    console.log("Trying to create account...");
    
    const userCredential = await createUserWithEmailAndPassword(
        auth,
        email,
        password
    );

    const uid = userCredential.user.uid;

    // Save user profile in Firestore
    await setDoc(doc(db, "users", uid), {

        uid: uid,
        id: "NN" + Date.now(),

        fullname: fullname,
        phone: phone,

        balance: 1000,
        lockedBonus: 1000,

        accountNo: "",
        bank: "",
        accountName: "",

        referredBy: referredBy || "",

        referralBonus: 0,

        joined: new Date().toISOString(),

        status: "active",

        hasInvested: false,

        savings: [],

        transactions: [
            {
                id: Date.now(),
                type: "Bonus",
                amount: 1000,
                status: "Approved",
                note: "Welcome Bonus - Locked",
                date: new Date().toLocaleString()
            }
        ]

    });
    await addDoc(collection(db, "notifications"), {

    userId: uid,

    title: "🎉 Welcome to NNAMP🇳🇬",

    message: "Welcome to NNAMP! We are excited and happy to have you with us. Start by making your first deposit and exploring our investment plans to unlock your welcome bonus. You can also click on savings to see the amazing offers earning you up to 25% daily profit of your savings.Happy investing! Save today save for future🌱💰",

    type: "welcome",

    createdAt: serverTimestamp(),

    read: false

});

localStorage.removeItem("referralCode");
    showAlert(
    "Success ✅\nWelcome to NNAMP 🎉",
    "Account created successfully!\n\n🔒 Security Reminder\nPlease save your password in a safe place.\n\nFor security purposes, password recovery is currently unavailable. You will need your password to access your account.\n\nHappy investing! 👍🤩",
    "success",
    function () {

        window.location.href = "login.html";

    }
);

} catch(error){

    if(error.code === "auth/email-already-in-use"){

        showAlert(
            "Already Registered",
            "This phone number already exists.",
            "error"
        );

    }else{

        showAlert(
            "Registration Failed",
            error.message,
            "error"
        );

    }

}
});
</script>
</body>
</html>
