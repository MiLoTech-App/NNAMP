<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>NNAMP - Admin Login</title>
    <style>
        .input-group{position:relative;}
        .toggle-password{position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;}
        input,
textarea,
select {
    font-size: 16px;
}
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">NNAMP ADMIN<span>🔒</span></div>
        <h2>Admin Login</h2>
        
        <form id="adminLoginForm">
            <input type="tel" class="input" id="adminPhone" placeholder="Admin Phone Number" required>
            
            <div class="input-group">
                <input type="password" class="input" id="adminPassword" placeholder="Admin Password" required>
                <span class="toggle-password" onclick="togglePassword('adminPassword')">👁️</span>
            </div>

            <button type="submit" class="btn" style="width:100%; margin-top:10px; background:#dc3545;">Login as Admin</button>
        </form>
        
        <p style="margin-top:20px; text-align:center;">
            <a href="login.html" style="color:gray; font-size:12px;">← Back to User Login</a>
        </p>
    </div>

<script type="module">
  import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import { initSessionManager } from "./session.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
initSessionManager(auth);
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
window.togglePassword = togglePassword;


    document.getElementById('adminLoginForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const phone = document.getElementById('adminPhone').value.trim();
    const password = document.getElementById('adminPassword').value;

    // Convert phone to hidden email
    const email = phone + "@nnamp.app";

    try{

        // Login with Firebase
        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const uid = userCredential.user.uid;

        // Load profile
        const userSnap = await getDoc(doc(db, "users", uid));

        if(!userSnap.exists()){
            showAlert(
                "Login Failed ❌",
                "User profile not found.",
                "error"
            );
            await signOut(auth);
            return;
        }

        const user = userSnap.data();

        // Check admin permission
        if(user.admin !== true){
            showAlert(
                "Access Denied ❌",
                "You are not an administrator.",
                "error"
            );

            await signOut(auth);
            return;
        }

        // Save admin session
        localStorage.setItem("nnamp_isAdmin", "true");

        showAlert(
            "Admin Login Successful ✅",
            "Welcome back, " + user.fullname,
            "success"
        );

        setTimeout(()=>{
            window.location.href = "admin.html";
        },2000);

    }catch(error){

        console.error(error);

        showAlert(
    "Login Failed ❌",
    "Incorrect phone number or password.",
    "error"
);
    }
});
</script>
<script src="script.js"></script>
<!-- NNAMP AUTO LOGOUT POPUP -->

<div id="logoutOverlay" class="logout-overlay">

    <div class="logout-box">

        <div class="logout-lock">
            🔒
        </div>

        <h2>Security Notice</h2>

        <p>
            You have been inactive.<br>
            For your security,<br>
            you will be logged out automatically.
        </p>

        <div class="countdown-container">

            <svg class="countdown-circle" width="130" height="130">

                <circle
                    class="circle-background"
                    cx="65"
                    cy="65"
                    r="55">
                </circle>

                <circle
                    id="circleProgress"
                    class="circle-progress"
                    cx="65"
                    cy="65"
                    r="55">
                </circle>

            </svg>

            <span id="countdownNumber">5</span>

        </div>


        <button id="stayLoggedInBtn">
            Stay Logged In
        </button>


    </div>

</div>
</body>
</html>
